<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>配達収支メモ｜試作版</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#152033;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 16px 60px}h1{font-size:24px;margin:6px 0}.muted{color:#66738a;font-size:13px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:17px;padding:18px;margin-top:16px;box-shadow:0 4px 14px #14213d08}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd3e0;border-radius:10px;font:inherit;background:white}button{border:0;border-radius:11px;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#1e62dc;color:white;width:100%;margin-top:16px}.secondary{background:#edf2fa;color:#1b4d9a}.danger{color:#b63b3b;background:#fff0f0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1f5fc;padding:13px;border-radius:12px}.stat b{font-size:23px;display:block;margin-top:5px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.entry{padding:13px 0;border-top:1px solid #e6eaf0}.entry:first-child{border:0}.entry strong{font-size:17px}.small{font-size:12px}.hint{background:#fff7e8;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px}.pill{display:inline-block;background:#e9f1ff;color:#2453a5;border-radius:100px;padding:5px 10px;font-size:12px;font-weight:700}footer{font-size:12px;color:#6b7483;line-height:1.7;margin-top:20px}</style></head><body><main class="wrap"><span class="pill">試作版・無料</span><h1>配達収支メモ</h1><p class="muted">売上と経費をサッと記録。月の収支がひと目で分かる。</p><section class="card"><div class="row"><h2 style="font-size:17px;margin:0">月の集計</h2><input aria-label="表示月" type="month" id="month" style="width:165px"></div><div class="stats" style="margin-top:14px"><div class="stat"><span class="muted">売上</span><b id="sales">¥0</b></div><div class="stat"><span class="muted">経費</span><b id="costs">¥0</b></div><div class="stat" style="grid-column:1/-1"><span class="muted">差引利益（税引前）</span><b id="profit">¥0</b></div></div></section><section class="card"><h2 style="font-size:17px;margin:0">収支を追加</h2><label for="date">日付</label><input type="date" id="date"><label for="kind">種類</label><select id="kind"><option value="sale">売上</option><option value="cost">経費</option></select><label for="amount">金額（円）</label><input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="例：12000"><label for="notePreset">内容（任意・選ぶだけ）</label><select id="notePreset"></select><div id="customNoteWrap" hidden><label for="note">その他の内容（任意）</label><input id="note" lang="ja" maxlength="80" placeholder="必要なときだけ入力"></div><button class="primary" id="add">記録する</button></section><section class="card"><h2 style="font-size:17px;margin:0 0 12px">この月の記録</h2><div id="entries" class="muted">まだ記録がありません。</div><div class="actions"><button class="secondary" id="export">CSVを書き出す</button><button class="danger" id="clear">この月の記録を削除</button></div></section><section class="card"><div class="hint"><strong>注意：</strong>週ごとの売上を入力した場合、入金日が属する月に全額計上します。週が月をまたぐ場合の厳密な月別稼働売上には対応していません。税金・社会保険料も差し引きません。</div></section><footer>データはこのブラウザ内だけに保存され、外部には送信されません。ブラウザのデータ消去・端末変更で失われるため、必要に応じてCSVを書き出してください。これは販売前の試作品です。</footer></main><script>const $=id=>document.getElementById(id),key='delivery-income-mini-v1',fmt=n=>'¥'+n.toLocaleString('ja-JP');let records=[];try{const r=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(r))records=r}catch{}const today=new Date(),localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);const noteOptions={sale:['選択しない','Uber Eats','出前館','menu','Wolt','その他'],cost:['選択しない','ガソリン代','充電代','車両整備','タイヤ交換','通信費','保険料','その他']};function updateNotes(){const sel=$('notePreset'),previous=sel.value;sel.replaceChildren();noteOptions[$('kind').value].forEach(v=>{const o=document.createElement('option');o.value=v==='選択しない'?'':v;o.textContent=v;sel.append(o)});if([...sel.options].some(o=>o.value===previous))sel.value=previous;toggleCustomNote()}function toggleCustomNote(){$('customNoteWrap').hidden=$('notePreset').value!=='その他'}$('kind').addEventListener('change',updateNotes);$('notePreset').addEventListener('change',toggleCustomNote);updateNotes();$('date').value=localDate;$('month').value=localDate.slice(0,7);function save(){localStorage.setItem(key,JSON.stringify(records))}function draw(){const m=$('month').value,a=records.filter(x=>x.date.slice(0,7)===m).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id),s=a.filter(x=>x.kind==='sale').reduce((n,x)=>n+x.amount,0),c=a.filter(x=>x.kind==='cost').reduce((n,x)=>n+x.amount,0);$('sales').textContent=fmt(s);$('costs').textContent=fmt(c);$('profit').textContent=fmt(s-c);const box=$('entries');box.replaceChildren();if(!a.length){box.textContent='まだ記録がありません。';return}a.forEach(x=>{const d=document.createElement('div');d.className='entry row';const info=document.createElement('div'),date=document.createElement('div'),v=document.createElement('strong'),note=document.createElement('div');date.className='muted small';date.textContent=x.date+' · '+(x.kind==='sale'?'売上':'経費');v.textContent=(x.kind==='cost'?'-':'+')+fmt(x.amount);note.className='muted small';note.textContent=x.note||'';info.append(date,v,note);const b=document.createElement('button');b.className='danger small';b.textContent='削除';b.addEventListener('click',()=>{if(confirm('この記録を削除しますか？')){records=records.filter(y=>y.id!==x.id);save();draw()}});d.append(info,b);box.append(d)})}$('add').onclick=()=>{const date=$('date').value,amount=Number($('amount').value);if(!date||!Number.isSafeInteger(amount)||amount<=0){alert('日付と1円以上の整数金額を入力してください');return}records.push({id:Date.now()+Math.random(),date,kind:$('kind').value,amount,note:$('notePreset').value==='その他'?$('note').value.trim():$('notePreset').value});save();$('month').value=date.slice(0,7);$('amount').value='';$('note').value='';$('notePreset').value='';toggleCustomNote();draw()};$('month').onchange=draw;$('clear').onclick=()=>{const m=$('month').value;if(confirm(m+'の記録をすべて削除しますか？')){records=records.filter(x=>x.date.slice(0,7)!==m);save();draw()}};$('export').onclick=()=>{const a=records.filter(x=>x.date.slice(0,7)===$('month').value);const rows=[['日付','種類','金額','メモ'],...a.map(x=>[x.date,x.kind==='sale'?'売上':'経費',x.amount,x.note])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='配達収支_'+$('month').value+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();</script></body></html>
